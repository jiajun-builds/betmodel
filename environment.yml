# Single conda environment for every league. Replaces csl-workflows + ligamx-workflows.
#   conda env create -f environment.yml && conda activate betmodel
#   pip install -e .
name: betmodel
channels: [conda-forge]
dependencies:
  - python=3.11
  - pandas>=2.0
  - numpy>=1.24
  - scipy>=1.10
  - requests>=2.28
  - matplotlib>=3.7
  - scikit-learn>=1.3
  - pyyaml>=6.0
  - pip
  - pip:
      - curl_cffi>=0.7
      - penaltyblog>=1.9
      - python-dotenv>=1.0
      - rich>=13.0
      - pytest>=7.4

# Liga MX.
#
# Same schema as leagues/csl.yml, different values. Where a value is knowingly
# stale it says so rather than being quietly corrected: the merge is verified by
# reproducing the pre-merge published output byte for byte, so a cosmetic fix now
# would be indistinguishable from a regression.

id: ligamx
name: Liga MX
code: MEX
season: Apertura 2026
timezone: America/Mexico_City
total_rounds: 17

# KNOWINGLY STALE. The fitter has been continuous Poisson since the integer
# truncation fix; this string still says Negative Binomial. It is published
# verbatim, so correcting it changes the golden comparison. Fix after gate G3.
model_name: Negative Binomial with Dixon-Coles Time Decay
model_version: v1.0

sources:
  # Liga MX stays on SofaScore for both, and MUST NOT be moved to TheSportsDB.
  # It was tried and its Liga MX match data is incomplete. This is the tempting
  # wrong turn: TheSportsDB is the one schedule provider a cloud runner reaches
  # without a residential proxy, so it looks like the obvious way to give this
  # league the automated refresh the other one already has. It is not available
  # for that, and both stages here need the residential egress path.
  fixtures:
    provider: sofascore
    network: residential
    tournaments:
      apertura: 11621
      clausura: 11620
  xg:
    provider: sofascore
    network: residential
    tournaments:
      apertura: 11621
      clausura: 11620
    # The liguilla goes to extra time, and the ALL rollup is then on an unknown
    # clock: on the Apertura 25/26 final it read (2.36, 0.66) against halves of
    # (2.68, 0.38) and extra time of (0.30, 0.05), so it is neither the ninety
    # minutes nor the full match. The half-sum is ninety minutes by construction,
    # which is the basis the scoreline and the model use. It is also the better
    # feature: MAE against goals 0.797 vs 0.815 over 696 team-innings.
    period_strategy: halves_sum

model:
  xi: 0.0015
  lookback_months: 24
  min_train: 100
  # Was 15 (a 16-cell grid). Reduced to match the other league: at this
  # league's scoring rates the mass outside a 10-cell grid is 7e-06, and
  # 1e-03 even on an extreme fixture. See docs/DECISIONS.md D2.
  max_goals: 9
  xg_blend: {xg: 0.25, goals: 0.75}   # chosen by walk-forward RPS search
  shrinkage: {enabled: true, k: 6.0}  # empirical Bayes, w = n / (n + k)
  draw_calibration_alpha: 1.0         # identity; the bias it corrected was a fitter bug
  ah_lines: [-1.5, -1.25, -1, -0.75, -0.5, -0.25, 0.25, 0.5, 0.75, 1, 1.25, 1.5]

odds:
  # Low on purpose. The floor is not what keeps the monthly account inside its
  # budget -- the anchor's own 8-day window is -- so its only job is to stop
  # cleanly rather than to hoard. Hoarding was actively harmful: at 48 remaining
  # every anchor slot was refused, and a single request is exactly what buys the
  # calibration a fixture gets one chance at. Fifty credits are not worth one
  # missed opener. If this ever binds, the answer is more credit, not a higher
  # floor.
  #
  # It was briefly held at 50 for a different reason -- the opener proof could not
  # then tell a recent unpriced sighting from a stale one, so unblocking the fetch
  # would have certified a late price as an opener. The proof now requires the
  # last confirmed sighting to be recent, and a late fetch is refused on its own
  # merits, so the floor no longer has to stand in for it.
  quota_floor: 10

  providers:
    theoddsapi:
      base_url: https://api.the-odds-api.com/v4
      sport_key: soccer_mexico_ligamx
      regions: eu,uk
      market: h2h
    oddsapiio:
      base_url: https://api.odds-api.io/v3
      # A key is entitled to a fixed, small number of bookmakers, and the two
      # leagues bet three distinct books between them, so they cannot share one.
      # Reads ODDS_API_IO_KEY_LIGAMX, falling back to ODDS_API_IO_KEY.
      credential: ligamx
      sport: football
      # Two slugs because Liga MX runs two tournaments per calendar year.
      league_slugs: [mexico-liga-mx-clausura, mexico-liga-mx-apertura]
      markets: [ML, Spread]
      batch_size: 10
      window_days: 30
    polymarket:
      gamma_base: https://gamma-api.polymarket.com
      clob_base: https://clob.polymarket.com

  books:
    - key: betano
      label: Betano
      provider: oddsapiio
      provider_name: Betano UK     # plain "Betano" 403s; the entitlement is the UK book
      role: bet
      # Declared but never polled. On the 8 fixtures where both books opened,
      # Duel was the better price on 22 of the 24 outcomes and tied the other 2 --
      # Betano did not win a single side, so the best-of composite came out at
      # Duel's own vig (1.040-1.045) rather than Betano's (1.082-1.087). It
      # contributed nothing to the price we would actually bet.
      #
      # Polling it was not merely useless, it was costly: `pending_fixtures`
      # calls a fixture pending while any polled book still owes an open, and
      # Betano stopped answering on 2026-08-13, so every Liga MX fixture stayed
      # pending forever and spent an oddsapiio request every tick chasing a book
      # that never replied. Dropping the interval is what stops that.
      #
      # The entry itself stays because the book still exists and could answer
      # again; nothing is gained by forgetting it. Give it back a
      # `poll_interval_minutes` if it ever starts quoting Liga MX worth taking.
      poll_interval_minutes: null
      schema_prefix: betano
    - key: duel
      label: Duel
      provider: oddsapiio
      provider_name: Duel
      role: bet
      poll_interval_minutes: 10
      schema_prefix: duel
    - key: pinnacle
      label: Pinnacle
      provider: theoddsapi
      # The de-bias anchor. Held at `reference` until this league had Pinnacle
      # opens to anchor to; it now has them for every priced fixture, which was
      # the stated precondition. Role only decides what is bettable, and an
      # anchor is never bet -- letting the price we intend to take also define
      # the probability we price it against is the mistake this guards.
      role: anchor
      # Opening lines are irreproducible and no provider sells opener history,
      # so capture starts now even though nothing consumes it yet.
      # Pinnacle publishes the next round while the current one is still being
      # played -- measured on 75 captures, median 6.1 days before kickoff and a
      # hard ceiling at 7.0. So an 8-day window covers publication with a day of
      # margin, and asking about anything further out is a request whose answer is
      # known in advance. Under the league's 21-day lookahead those were most of
      # the month's allowance, which then ran out at the end of the period exactly
      # when the anchor mattered.
      lookahead_days: 8
      # Hourly inside that window. What the cadence buys is being already watching
      # when the line appears, so `capture_watch` records the fixture unpriced
      # beforehand and the price we then take is a *proven* opener -- a day of
      # pending at this rate is ~24 unpriced sightings.
      #
      # Sized against this league's own fixture density, which is roughly four
      # times CSL's: simulated over the next 30 days, 30-minute polling costs 438
      # requests plus ~96 for closes and does not fit in 500/month. Hourly costs
      # 219, and 300 on the pessimistic assumption that Pinnacle prices at 6 days
      # rather than 7.
      poll_interval_minutes: 60
      credential: ligamx
      schema_prefix: pinnacle
    - key: betfair_ex_eu
      label: Betfair Exchange EU
      provider: theoddsapi
      role: reference
      schema_prefix: betfair
    - key: polymarket
      label: Polymarket
      provider: polymarket
      role: reference              # free and retroactively backfillable, so never polled
      schema_prefix: polymarket

  close:
    credential: ligamx
    books: [pinnacle, betfair_ex_eu]
    # 20 -> 15 to match the other league. Measured here: the capture that becomes
    # the close sits at p90 9.6 minutes before kickoff and worst case 14.6, so a
    # 15-minute window loses nothing on this evidence.
    window_minutes: 15
    target_minutes: 10
    # Deliberately far below `odds.quota_floor`, and that gap is the whole
    # mechanism. The open floor exists to stop spending the tail of the period on
    # opening lines so that closes -- which have a hard deadline at kickoff and
    # cannot be bought back at any price -- still have credit. Setting both to 50
    # meant the reserve protected nothing: at 48 remaining the opens stopped,
    # correctly, and the closes stopped too, so the last 50 credits of every
    # period were unspendable by anything. Observed on 2026-08-31, when every
    # anchor slot and every close was refused against 48 remaining.
    #
    # Nothing downstream outranks a close, so this is a stop-cleanly floor rather
    # than a reserve. At one request per tick and three ticks a fixture, the 45
    # credits it now frees are about fifteen fixtures' worth.
    min_remaining: 5

  open:
    lookahead_days: 14
    max_requests: 3

signals:
  ev_min: 0.10                   # fraction; backed by a 427-opener walk-forward test
  odds_cap: null                 # no cap here
  allow_draw: true
  require_price_proof: true
  # Fifteen weighted matches before a club's fixtures may fire.
  #
  # Shrinkage regularises a thin rating; it does not make it bettable. Its target
  # is the league mean, and for a promoted side that is the wrong prior -- it pulls
  # a club nobody has seen toward average and so overrates it. Atlante, six matches
  # in, sat 6.0 points above Pinnacle's no-vig line on its own fixture, which is
  # the difference between a -1.5% price and a +21.3% signal.
  #
  # Keeping those matches in the training set costs nothing: measured walk-forward
  # over the 48 fixtures since Atlante's first, dropping them moves log loss by
  # +0.00008 (95% CI [-0.00176, +0.00195]). The problem is not their influence on
  # the league, it is betting on the club itself.
  #
  # Self-expiring, like every threshold here: Atlante is at 5.8 and clears this in
  # roughly half a season. Established clubs sit at 35-52, so this cannot catch one.
  min_team_evidence: 15      # a signal needs a provably-first price, see capture_watch
  debias:
    # The model prices the draw worst and the market prices it best, so the draw
    # is replaced by Pinnacle's no-vig OPENING draw and the freed mass returned
    # to home and away pro rata. The opening price, never the current one: by the
    # time a current price exists it has absorbed news the model has not, and
    # anchoring on it calibrates today's probability against tomorrow's market.
    #
    # Turned on once this league had anchors for every priced fixture. It does
    # change which bets fire -- measured on the Chinese Super League the same
    # correction moves EV by 2.3 to 6.4 points, downward every time -- so the
    # effect on this league is recorded in D30 rather than assumed to be small.
    method: market_anchor
    lambda: 1.0
    anchor_book: pinnacle

publish:
  # Validated 2026-08-31. The caveat named two blockers and both were downstream,
  # not here: the board hardcoded CSL's 0.20 bar so every Liga MX signal above its
  # own threshold read as thin, and it dropped the opener proof the contract had
  # been carrying all along. Both are fixed and deployed.
  #
  # The threshold itself was re-measured rather than taken on trust. Walk-forward
  # over 464 Betano openers, refitting per matchday, the EV >= 10% rule fired 177
  # bets and beat Pinnacle's closing line by +0.073 on average, 95% CI
  # [+0.033, +0.113]. See D31 for what that does and does not establish.
  validated: true
  caveat: ""

notify:
  # On. This league is the one that actually fires, and an alert that reaches a
  # lock screen is the only thing bounding "signal exists" to "human sees it".
  # Note the source is still validated: false, so a firing row is a candidate
  # rather than a bet, and the caveat above says why.
  telegram: true

# Chinese Super League.
#
# Every value here was a module-level constant in cslmonitor. Where a value is
# knowingly stale it says so, rather than being quietly corrected: the merge is
# verified by reproducing the pre-merge published output byte for byte, so a
# cosmetic fix now would look identical to a regression.

id: csl
name: Chinese Super League
code: CSL
season: "2026"
timezone: Europe/London          # display tz; source CSVs store UTC
total_rounds: 35

model_name: Weighted Poisson on xG with Dixon-Coles Time Decay
model_version: v2.8

sources:
  fixtures:
    provider: thesportsdb
    network: cloud               # plain HTTP, runs anywhere
    league_id: "4359"
    max_rounds: 35
    seasons:
      - ["2026", ["2026", "2026-2027"]]
  xg:
    provider: sofascore
    network: residential         # Cloudflare 403s datacenter IPs; curl_cffi is
                                 # necessary but not sufficient, the IP matters
    unique_tournament_id: 649
    season_id: 90049
    # The ALL rollup, for two reasons that both have to hold. This is a straight
    # league season with no knockout stage, so no match can go to extra time and
    # the rollup is a ninety-minute figure. And SofaScore publishes this league's
    # per-half xG as literal 0.0, so the halves carry nothing. Verified against
    # live data 2026-08-28. If this league ever gains a play-off, the provider
    # falls back to the halves on its own and says so.
    period_strategy: all_first

model:
  xi: 0.001                      # Dixon-Coles time decay
  lookback_months: 18
  min_train: 100
  # Highest scoreline modelled, so the grid is 10 cells a side. Stated
  # explicitly because the two pre-merge fitters read a field of this name
  # differently: one built arange(max_goals), the other arange(max_goals + 1).
  max_goals: 9
  xg_blend: {xg: 0.7, goals: 0.3}
  shrinkage: {enabled: false}
  draw_calibration_alpha: 1.0    # identity; the bias it corrected was a fitter bug
  # Asian-handicap cover probabilities written to the simulations file. Research
  # input only: nothing in the production path reads them.
  ah_lines: [-2, -1]

odds:
  # Low on purpose. The floor is not what keeps the monthly account inside its
  # budget -- the anchor's own 8-day window is -- so its only job is to stop
  # cleanly rather than to hoard. Hoarding was actively harmful: at 48 remaining
  # every anchor slot was refused, and a single request is exactly what buys the
  # calibration a fixture gets one chance at. Fifty credits are not worth one
  # missed opener. If this ever binds, the answer is more credit, not a higher
  # floor.
  #
  # It was briefly held at 50 for a different reason -- the opener proof could not
  # then tell a recent unpriced sighting from a stale one, so unblocking the fetch
  # would have certified a late price as an opener. The proof now requires the
  # last confirmed sighting to be recent, and a late fetch is refused on its own
  # merits, so the floor no longer has to stand in for it.
  quota_floor: 10

  providers:
    theoddsapi:
      base_url: https://api.the-odds-api.com/v4
      sport_key: soccer_china_superleague
      regions: us
      market: h2h
    oddsapiio:
      base_url: https://api.odds-api.io/v3
      # A key is entitled to a fixed, small number of bookmakers, and the two
      # leagues bet three distinct books between them, so they cannot share one.
      # Reads ODDS_API_IO_KEY_CSL, falling back to ODDS_API_IO_KEY.
      credential: csl
      sport: football
      league_slugs: [china-chinese-super-league]
      markets: [ML]
      batch_size: 10             # /odds/multi returns 10 events per request

  # Order is load-bearing: it sets published column order and breaks ties when
  # two books quote the same best price.
  books:
    - key: onexbet
      label: 1xBet
      provider: oddsapiio
      provider_name: "1xbet"
      role: bet
      poll_interval_minutes: 10
      schema_prefix: onexbet
      legacy_prefix: onexbet_open
      legacy_prefix_note: >
        Frozen. The published column names are derived from the book key
        downstream, and every stored row plus the board's own column vocabulary
        already spell it this way. Renaming blanks every CSL price silently.
    - key: duel
      label: Duel
      provider: oddsapiio
      provider_name: Duel
      role: bet
      poll_interval_minutes: 10
      schema_prefix: duel
    - key: pinnacle
      label: Pinnacle
      provider: theoddsapi
      role: anchor               # never bet, never displayed; de-bias input only
      # Pinnacle publishes the next round while the current one is still being
      # played -- measured on 75 captures, median 6.1 days before kickoff and a
      # hard ceiling at 7.0. So an 8-day window covers publication with a day of
      # margin, and asking about anything further out is a request whose answer is
      # known in advance. Under the league's 21-day lookahead those were most of
      # the month's allowance, which then ran out at the end of the period exactly
      # when the anchor mattered.
      lookahead_days: 8
      # Hourly inside that window, not three-hourly. What the cadence buys is the
      # thing the pipeline rests on: being already watching when the line appears,
      # so `capture_watch` records the fixture unpriced beforehand and the price we
      # then take is a *proven* opener. A day of pending at this rate is ~24
      # unpriced sightings, which is proof several times over.
      #
      # Sized, not guessed. Simulated minute by minute over the next 30 days of
      # each fixture list, requests per period including ~96 for closes:
      #
      #            30min   60min
      #   CSL        144     120
      #   Liga MX    534     315      <- 30min does not fit in 500/month
      #
      # and still inside the budget on the pessimistic assumption that Pinnacle
      # prices at 6 days rather than 7 (Liga MX 396). Faster buys nothing anyway:
      # the soft books open about a day after the anchor, so an hour of staleness
      # on the anchor is immaterial next to that gap.
      poll_interval_minutes: 60
      credential: csl
      schema_prefix: pinnacle
    - key: betfair_ex_eu
      label: Betfair Exchange EU
      provider: theoddsapi
      role: reference
      schema_prefix: betfair
    - key: betfair_ex_uk
      label: Betfair Exchange UK
      provider: theoddsapi
      role: reference
      schema_prefix: null

  close:
    credential: csl
    books: [pinnacle, betfair_ex_eu, betfair_ex_uk]
    # Was 60 minutes on a 10-minute trigger, which is six ticks a fixture and
    # still only reached the target band on 27% of them, worst case 33.6 minutes
    # out. The trigger was the bottleneck, not the window. On a 5-minute trigger
    # 15 minutes is three ticks: cheaper and more accurate. Narrowing without
    # speeding the trigger would have left 12% of fixtures with no close at all,
    # and a close missed is unrecoverable at any price.
    window_minutes: 15
    target_minutes: 10
    # Deliberately far below `odds.quota_floor`, and that gap is the whole
    # mechanism. The open floor exists to stop spending the tail of the period on
    # opening lines so that closes -- which have a hard deadline at kickoff and
    # cannot be bought back at any price -- still have credit. Setting both to 50
    # meant the reserve protected nothing: at 48 remaining the opens stopped,
    # correctly, and the closes stopped too, so the last 50 credits of every
    # period were unspendable by anything. Observed on 2026-08-31, when every
    # anchor slot and every close was refused against 48 remaining.
    #
    # Nothing downstream outranks a close, so this is a stop-cleanly floor rather
    # than a reserve. At one request per tick and three ticks a fixture, the 45
    # credits it now frees are about fifteen fixtures' worth.
    min_remaining: 5

  open:
    lookahead_days: 21
    max_requests: 4

signals:
  ev_min: 0.20                   # fraction, never percentage points
  odds_cap: 7.0
  allow_draw: false              # draws are never bet here
  require_price_proof: false     # no capture_watch history yet; see leagues/ligamx.yml
  debias:
    method: market_anchor
    lam: 1.0                     # the draw IS the anchor's no-vig draw
    # The anchor is the stored OPENING price, never the current one. The Now line
    # is not fetched at all any more; see docs/DECISIONS.md D1.
    anchor_book: pinnacle

publish:
  legacy_contract: per_book
  legacy_ev_unit: fraction
  validated: true

notify:
  telegram: true

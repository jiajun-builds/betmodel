# Major League Soccer.
#
# The acceptance test for the merge: this file and one team-name mapping CSV are
# the whole of adding a league. If anything under src/ has to change, the
# abstraction did not hold.
#
# Values are starting points, not tuned parameters. The model settings are
# copied from the league whose scoring rates are closest and must be re-fitted
# by walk-forward search before this league's signals mean anything, which is
# why publish.validated is false.

id: mls
name: Major League Soccer
code: MLS
season: "2026"
timezone: America/New_York
total_rounds: 34

model_name: Weighted Poisson on xG with Dixon-Coles Time Decay
model_version: v0.1

sources:
  fixtures:
    provider: thesportsdb          # reachable from a cloud runner
    network: cloud
    league_id: "4346"
    max_rounds: 34
    seasons:
      - ["2026", ["2026", "2026-2027"]]
  xg:
    provider: sofascore
    network: residential           # blocks datacenter IPs; needs the proxy
    unique_tournament_id: 242
    # No knockout stage in the regular season, but the play-offs do go to extra
    # time, so the rollup cannot be assumed to be a ninety-minute figure.
    period_strategy: halves_sum

model:
  xi: 0.0015
  lookback_months: 24
  min_train: 100
  max_goals: 9
  xg_blend: {xg: 0.25, goals: 0.75}
  shrinkage: {enabled: true, k: 6.0}
  draw_calibration_alpha: 1.0

odds:
  quota_floor: 50

  providers:
    theoddsapi:
      base_url: https://api.the-odds-api.com/v4
      sport_key: soccer_usa_mls
      regions: us
      market: h2h
    oddsapiio:
      base_url: https://api.odds-api.io/v3
      sport: football
      league_slugs: [usa-mls]
      markets: [ML]
      batch_size: 10
      # No key of its own yet: a key is entitled to a fixed set of bookmakers, so
      # this league shares one until it has books worth paying for separately.
      credential: default

  books:
    - key: duel
      label: Duel
      provider: oddsapiio
      provider_name: Duel
      role: bet
      poll_interval_minutes: 10
      schema_prefix: duel
    - key: pinnacle
      label: Pinnacle
      provider: theoddsapi
      role: reference
      poll_interval_minutes: 180
      credential: opens
      schema_prefix: pinnacle
    - key: betfair_ex_eu
      label: Betfair Exchange EU
      provider: theoddsapi
      role: reference
      schema_prefix: betfair

  close:
    credential: closes
    books: [pinnacle, betfair_ex_eu]
    window_minutes: 15
    target_minutes: 10
    min_remaining: 50

  open:
    lookahead_days: 14
    max_requests: 3

signals:
  # Not tuned. Deliberately above both tuned leagues so nothing fires while the
  # threshold is a guess; a bar that has not been backtested is not a bar.
  ev_min: 0.25
  odds_cap: 7.0
  allow_draw: true
  require_price_proof: true
  debias: {method: none}

publish:
  legacy_contract: composite
  legacy_ev_unit: fraction
  validated: false
  caveat: >
    Newly added league. Model parameters are borrowed, the signal threshold is a
    placeholder rather than a backtested bar, and no opening-line history exists
    yet. Nothing here is a bet.

notify:
  telegram: false

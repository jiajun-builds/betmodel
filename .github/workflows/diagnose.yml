# Run a read-only diagnostic where the working keys are.
#
# The capture keys live in this repository's secrets and nowhere else, so a
# question about what a provider is actually returning cannot be answered from a
# laptop. Reproducing one by hand also means reproducing the exact window, slug
# and book list the capture uses, and a diagnosis run against slightly different
# parameters answers a slightly different question.
#
# Manual only, and it spends provider requests, so it is not on a schedule.
name: diagnose

on:
  workflow_dispatch:
    inputs:
      league:
        description: A league id
        default: csl
      lookback:
        description: Days of PAST to include in the event window
        default: "0"
      lookahead:
        description: Days ahead, or blank for the league's own open lookahead
        default: ""
      odds:
        description: Also ask odds/multi about whatever matched (one more request)
        type: boolean
        default: false
      leagues:
        description: List the provider's league slugs matching this, instead of events
        default: ""
      no_window:
        description: Ask for events with no from/to filter at all
        type: boolean
        default: false
      books:
        description: With odds, override the bookmakers asked for (provider spelling)
        default: ""
      emit_rows:
        description: With anchor_books, print the bet books' prices as store rows
        type: boolean
        default: false
      anchor_books:
        description: Regions to ask The Odds API which bookmakers it carries (e.g. eu,uk)
        default: ""

permissions:
  contents: read

# Deliberately not the `capture` group. This reads and writes nothing, so it
# cannot conflict with a tick -- and queueing it behind one would mean a
# diagnostic that runs after the state it was meant to diagnose has moved.
concurrency:
  group: diagnose
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Event listing
        env:
          ODDS_API_IO_KEY_CSL: ${{ secrets.ODDS_API_IO_KEY_CSL }}
          ODDS_API_IO_KEY_LIGAMX: ${{ secrets.ODDS_API_IO_KEY_LIGAMX }}
          THE_ODDS_API_KEY_CSL: ${{ secrets.THE_ODDS_API_KEY_CSL }}
          THE_ODDS_API_KEY_LIGAMX: ${{ secrets.THE_ODDS_API_KEY_LIGAMX }}
        run: |
          python scripts/check_event_listing.py "${{ inputs.league }}" \
            --lookback "${{ inputs.lookback }}" \
            ${{ inputs.lookahead && format('--lookahead {0}', inputs.lookahead) || '' }} \
            ${{ inputs.odds && '--odds' || '' }} \
            ${{ inputs.leagues && format('--leagues {0}', inputs.leagues) || '' }} \
            ${{ inputs.anchor_books && format('--anchor-books {0}', inputs.anchor_books) || '' }} \
            ${{ inputs.no_window && '--no-window' || '' }} \
            ${{ inputs.emit_rows && '--emit-rows' || '' }} \
            ${{ inputs.books && format('--books {0}', inputs.books) || '' }}

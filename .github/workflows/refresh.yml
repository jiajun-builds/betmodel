# The full refresh: fixtures, xG, model, signals, publish.
#
# Both leagues run here, which is new. One of them had no scheduled refresh at
# all before the merge, because its schedule and xG both come from a provider
# that refuses datacenter IPs and there was no residential path from CI. There is
# now, so the difference between the two leagues is a proxy secret rather than a
# manual step on a laptop.
name: refresh

on:
  # Triggered by the capture timer, not by GitHub's scheduler. Measured on this
  # project over 299 runs, a requested every-10-minutes GitHub schedule landed at
  # a median of 10 minutes, a p90 of 137 and a worst case of 232 -- and twice, on
  # 29 and 31 August, the daily 06:17 did not fire at all. That reasoning already
  # governed the capture ticks; leaving this one on `schedule:` was an
  # inconsistency, and it cost two silent days of stale fixtures, results and xG.
  repository_dispatch:
    types: [refresh-tick]
  workflow_dispatch:
    inputs:
      league:
        description: A league id, or 'all'
        default: all
      dry_run:
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('pyproject.toml') }}

      - name: Install
        run: pip install --quiet -e .

      # Everything below can reach its provider from a cloud runner EXCEPT the
      # SofaScore stages, which are refused on IP. Only that provider reads this
      # variable, and when it is unset the same code runs direct, which is what
      # makes a laptop and a runner the same code path rather than two.
      # These two continue on error so a provider outage still leaves the model
      # refitted and published from the data already on disk -- yesterday's
      # numbers beat no numbers. The run is failed at the end instead, by
      # "Fail if a fetch failed": without that, a refresh that fetched nothing
      # reported success, and stale output is only noticed days later by whoever
      # reads a number that stopped moving.
      - name: Fixtures
        id: fixtures
        env:
          SOFASCORE_PROXY_URL: ${{ secrets.SOFASCORE_PROXY_URL }}
        run: betmodel ${{ inputs.league || 'all' }} fixtures
             ${{ inputs.dry_run && '--dry-run' || '' }}
        continue-on-error: true

      - name: xG
        id: xg
        env:
          SOFASCORE_PROXY_URL: ${{ secrets.SOFASCORE_PROXY_URL }}
        run: betmodel ${{ inputs.league || 'all' }} xg
             ${{ inputs.dry_run && '--dry-run' || '' }}
        continue-on-error: true

      - name: Reduce captured odds into the match table
        run: betmodel ${{ inputs.league || 'all' }} reduce
             ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Fit the model
        run: betmodel ${{ inputs.league || 'all' }} model
             ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Publish
        if: ${{ !inputs.dry_run }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          betmodel ${{ inputs.league || 'all' }} publish
          betmodel index
          betmodel ${{ inputs.league || 'all' }} notify

      # always(), and deliberately last. A monitor that only runs when the thing
      # it monitors succeeded is silent exactly when it is needed: if the xG step
      # above fails or never runs, that IS the condition to alert on.
      - name: xG staleness check
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: betmodel ${{ inputs.league || 'all' }} freshness
             ${{ inputs.dry_run && '--dry-run' || '' }}

      # After Publish, because it reads what was published rather than what was
      # computed: the question is whether the configured de-bias reached the
      # consumer, not whether the engine could have applied it.
      - name: De-bias reached the published signals
        if: ${{ !inputs.dry_run }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/check_debias_applied.py

      # Hosted here rather than in the capture workflow itself, because a job
      # that is failing cannot be relied on to report that it is failing, and a
      # five-minute cadence makes a per-run alert noise. Once a day is the right
      # frequency for "has this been down all day".
      - name: Capture dead-man's switch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/check_capture_health.py --window-hours 24
             ${{ inputs.dry_run && '--dry-run' || '' }}

      # One commit covering both trees, deliberately. Splitting them so each
      # could be classified separately reads better and does not work: this job
      # produces data/ and public/ changes together, so committing one leaves the
      # other unstaged, and `git pull --rebase` refuses to run on a dirty tree.
      # Reaching for --autostash makes it worse -- the stash reapplies over the
      # rebased tree, conflicts, and leaves conflict markers inside the published
      # JSON, which then gets committed and served. Both were caught in a
      # scratch-repo rehearsal of an actual race, not in production.
      #
      # A single commit keeps the tree clean. The two classes are still handled
      # differently where it counts: the append-only histories merge through the
      # union driver in .gitattributes, and derived: true resolves whatever is
      # left, all of which is regenerated on the next run.
      - name: Commit
        if: ${{ !inputs.dry_run }}
        uses: ./.github/actions/commit-data
        with:
          message: "chore(data): daily refresh"
          paths: data public
          derived: "true"
          skip_ci: "false"

      # Last, so everything above has already run and committed. A fetch that
      # failed is still a failed refresh, whatever was salvaged from disk.
      #
      # This also alerts, because the staleness monitor above cannot serve as the
      # failure channel: it reports data going stale, which is a different event
      # with a different latency. At a 3-day threshold, two days of a broken
      # refresh are silent on Telegram, and the only other signal is a GitHub
      # email that depends on a per-account notification setting.
      #
      # Sent with curl rather than through the package, deliberately: this must
      # still reach the phone when the failure is the package refusing to
      # import, which is precisely when the CLI cannot be used to report it.
      - name: Fail if a fetch failed
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          failed=""
          [ "${{ steps.fixtures.outcome }}" = "failure" ] && failed="$failed fixtures"
          [ "${{ steps.xg.outcome }}" = "failure" ] && failed="$failed xG"
          # A step that failed without continue-on-error already failed the job;
          # catch that too, so this is the one place a broken refresh is reported.
          [ "${{ job.status }}" = "failure" ] && failed="$failed (a step failed)"

          if [ -z "$failed" ]; then
            echo "every fetch succeeded"
            exit 0
          fi

          echo "::error::refresh failed:$failed"
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            # The alert is best-effort: a send that fails must not replace the
          # failure it was reporting, so its error is logged and swallowed.
            text=$(printf 'betmodel refresh failed:%s\n%s' "$failed" "$run_url")
            curl -sS --max-time 20 -o /dev/null \
              "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
              --data-urlencode "text=$text" || echo "alert could not be sent" >&2
          else
            echo "no telegram credentials; alerting skipped" >&2
          fi
          exit 1

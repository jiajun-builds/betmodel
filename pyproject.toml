[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "betmodel"
version = "0.1.0"
description = "Multi-league football betting model: one engine, leagues are configuration."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "requests>=2.28",
    "curl_cffi>=0.7",
    "penaltyblog>=1.9",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
# Only the research harnesses under betmodel.eval need these.
eval = ["matplotlib>=3.7", "scikit-learn>=1.3"]
dev = ["pytest>=7.4"]

[project.scripts]
betmodel = "betmodel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
